[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claudetrade"
version = "0.1.0"
description = "Swing-trading research and decision-support application (research signals only, not financial advice)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ClaudeTrade contributors" }]
keywords = ["trading", "research", "backtesting", "sentiment", "swing-trading"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "SQLAlchemy>=2.0",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dateutil>=2.9",
    "typer>=0.12",
    "httpx>=0.27",
    "APScheduler>=3.10",
    "keyring>=25.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.36", "plotly>=5.22", "openpyxl>=3.1"]
ml = ["scikit-learn>=1.4"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "types-python-dateutil",
]
build = ["pyinstaller>=6.6"]
all = ["claudetrade[ui,ml,dev,build]"]

[project.scripts]
claudetrade = "claudetrade.cli:main"

[project.urls]
Homepage = "https://github.com/afallows/claudetrade"
Documentation = "https://github.com/afallows/claudetrade/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
claudetrade = [
    "py.typed",
    "resources/*.json",
    "resources/*.csv",
    "data/universes/*.csv",
    # The built React SPA ships inside the wheel so end users never need Node.
    "webapi/static/*",
    "webapi/static/assets/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running tests (backtests, walk-forward)",
    "network: requires outbound network access (skipped by default)",
    "integration: end-to-end flows",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ARG", "DTZ"]
ignore = [
    "E501",    # line length handled by formatter
    "B008",    # typer uses function calls in defaults
    "RUF012",  # mutable class attrs (pydantic/SQLAlchemy patterns)
    "N803",    # allow financial notation (K, D, ATR) in args
    "N806",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "N802", "DTZ"]
"src/claudetrade/ui/*" = ["ARG"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["claudetrade"]
ignore_missing_imports = true
warn_unused_configs = true
no_implicit_optional = true
warn_redundant_casts = true
disallow_untyped_defs = false
check_untyped_defs = true
exclude = "(^|/)(build|dist|\\.venv)/"

[[tool.mypy.overrides]]
module = ["streamlit.*", "plotly.*", "apscheduler.*", "keyring.*", "sklearn.*"]
ignore_errors = true
